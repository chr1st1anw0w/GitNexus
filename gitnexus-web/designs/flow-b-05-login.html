<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GitNexus AI Hub — Login</title>
<style>
  :root {
    --base:        #080c14;
    --glass-bg:    rgba(255,255,255,0.06);
    --glass-bg-md: rgba(255,255,255,0.08);
    --glass-bd:    rgba(255,255,255,0.10);
    --glass-bd-md: rgba(255,255,255,0.15);
    --accent:      #6366f1;
    --accent-dark: #4f46e5;
    --success:     #10b981;
    --warning:     #f59e0b;
    --text-pri:    #f1f5f9;
    --text-sec:    #94a3b8;
    --text-muted:  #64748b;
    --radius-sm:   8px;
    --radius-md:   12px;
    --radius-lg:   16px;
    --blur:        blur(24px);
    --font:        'Helvetica Neue', Helvetica, 'Inter', Arial, sans-serif;
    --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:40px; --s6:48px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: var(--font);
    background-color: var(--base);
    color: var(--text-pri);
    -webkit-font-smoothing: antialiased;
  }
  .scene {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: var(--s4);
    background-image: radial-gradient(circle, rgba(255,255,255,0.07) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .orb { position: absolute; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; }
  .orb-1 { width:560px; height:560px; background:radial-gradient(circle,rgba(99,102,241,0.18) 0%,transparent 70%); top:-140px; left:-140px; }
  .orb-2 { width:480px; height:480px; background:radial-gradient(circle,rgba(79,70,229,0.15) 0%,transparent 70%); bottom:-100px; right:5%; }
  .orb-3 { width:360px; height:360px; background:radial-gradient(circle,rgba(16,185,129,0.13) 0%,transparent 70%); bottom:20%; left:10%; }
  .card {
    position:relative; z-index:1; width:480px;
    background:var(--glass-bg);
    backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:var(--radius-lg); padding:var(--s6);
    box-shadow:0 32px 64px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.04) inset;
  }
  .logo-row { display:flex; align-items:center; gap:var(--s2); margin-bottom:var(--s1); }
  .logo-text { font-size:20px; font-weight:700; letter-spacing:-0.4px; }
  .tagline { font-size:13px; color:var(--text-sec); margin-bottom:var(--s4); }
  .divider { height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.10),transparent); margin-bottom:var(--s4); }
  .btn-github {
    display:flex; align-items:center; justify-content:center; gap:var(--s1);
    width:100%; padding:11px var(--s3);
    background:#ffffff; color:#0d1117;
    border:none; border-radius:var(--radius-sm);
    font-size:14px; font-weight:600; font-family:var(--font);
    cursor:pointer; transition:background 0.15s,transform 0.1s;
  }
  .btn-github:hover { background:#e8eaed; transform:translateY(-1px); }
  .or-row { display:flex; align-items:center; gap:var(--s2); margin:var(--s3) 0; }
  .or-row::before,.or-row::after { content:''; flex:1; height:1px; background:rgba(255,255,255,0.10); }
  .or-label { font-size:12px; color:var(--text-muted); letter-spacing:0.5px; text-transform:uppercase; }
  .field-group { display:flex; flex-direction:column; gap:var(--s2); margin-bottom:var(--s3); }
  .field-label { display:block; font-size:12px; font-weight:500; color:var(--text-sec); margin-bottom:6px; }
  .field-input {
    width:100%; padding:11px var(--s2);
    background:var(--glass-bg-md); border:1px solid var(--glass-bd-md);
    border-radius:var(--radius-sm); font-size:14px; font-family:var(--font);
    color:var(--text-pri); outline:none; transition:border-color 0.15s,background 0.15s;
  }
  .field-input::placeholder { color:var(--text-muted); }
  .field-input:focus { border-color:rgba(99,102,241,0.6); background:rgba(99,102,241,0.08); }
  .field-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .forgot-link { font-size:12px; color:var(--accent); text-decoration:none; }
  .btn-signin {
    width:100%; padding:12px var(--s3);
    background:linear-gradient(135deg,#6366f1 0%,#4f46e5 100%);
    color:#fff; border:none; border-radius:var(--radius-sm);
    font-size:14px; font-weight:600; font-family:var(--font);
    cursor:pointer; margin-bottom:var(--s4);
    box-shadow:0 4px 16px rgba(99,102,241,0.35);
    transition:opacity 0.15s,transform 0.1s;
  }
  .btn-signin:hover { opacity:0.88; transform:translateY(-1px); }
  .role-label { font-size:12px; font-weight:500; color:var(--text-sec); margin-bottom:var(--s1); }
  .role-pills { display:flex; gap:var(--s1); }
  .pill {
    flex:1; padding:8px var(--s1);
    background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.10);
    border-radius:var(--radius-sm); font-size:12px; font-weight:500;
    color:var(--text-sec); cursor:pointer; text-align:center; transition:all 0.15s;
  }
  .pill:hover { background:rgba(255,255,255,0.08); color:var(--text-pri); }
  .pill.active { background:rgba(99,102,241,0.15); border-color:rgba(99,102,241,0.7); color:#a5b4fc; }
  .pill-role { display:block; font-weight:700; font-size:11px; }
  .pill-agent { display:block; font-size:10px; color:var(--text-muted); margin-top:2px; }
  .pill.active .pill-agent { color:rgba(165,180,252,0.7); }
  .signup-row { margin-top:var(--s3); text-align:center; font-size:13px; color:var(--text-muted); }
  .signup-row a { color:var(--accent); text-decoration:none; }
  .version-badge { position:fixed; bottom:var(--s3); right:var(--s3); font-size:11px; color:var(--text-muted); }
</style>
</head>
<body>
<div class="scene">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="card">
    <div class="logo-row">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
        <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="rgba(99,102,241,0.2)" stroke="rgba(99,102,241,0.8)" stroke-width="1.5"/>
        <polygon points="20,8 30,14 30,26 20,32 10,26 10,14" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.5)" stroke-width="1"/>
        <circle cx="20" cy="20" r="4" fill="#6366f1"/>
        <line x1="20" y1="14" x2="20" y2="10" stroke="rgba(99,102,241,0.7)" stroke-width="1.5"/>
        <line x1="25.2" y1="17" x2="28.6" y2="15" stroke="rgba(99,102,241,0.7)" stroke-width="1.5"/>
        <line x1="25.2" y1="23" x2="28.6" y2="25" stroke="rgba(99,102,241,0.7)" stroke-width="1.5"/>
        <line x1="20" y1="26" x2="20" y2="30" stroke="rgba(99,102,241,0.7)" stroke-width="1.5"/>
        <line x1="14.8" y1="23" x2="11.4" y2="25" stroke="rgba(99,102,241,0.7)" stroke-width="1.5"/>
        <line x1="14.8" y1="17" x2="11.4" y2="15" stroke="rgba(99,102,241,0.7)" stroke-width="1.5"/>
      </svg>
      <span class="logo-text">GitNexus AI Hub</span>
    </div>
    <p class="tagline">AI-Powered Collaborative Development</p>
    <div class="divider"></div>
    <button class="btn-github" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#0d1117"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
      Continue with GitHub
    </button>
    <div class="or-row"><span class="or-label">or</span></div>
    <div class="field-group">
      <div>
        <label class="field-label" for="email">Email address</label>
        <input class="field-input" id="email" type="email" placeholder="you@company.com" />
      </div>
      <div>
        <div class="field-row">
          <label class="field-label" for="password" style="margin-bottom:0">Password</label>
          <a class="forgot-link" href="#">Forgot password?</a>
        </div>
        <input class="field-input" id="password" type="password" placeholder="••••••••" />
      </div>
    </div>
    <button class="btn-signin" type="button">Sign In</button>
    <div class="role-section">
      <p class="role-label">Select your AI Role:</p>
      <div class="role-pills">
        <div class="pill" onclick="selectPill(this)"><span class="pill-role">PM</span><span class="pill-agent">Claude</span></div>
        <div class="pill active" onclick="selectPill(this)"><span class="pill-role">UI</span><span class="pill-agent">Gemini</span></div>
        <div class="pill" onclick="selectPill(this)"><span class="pill-role">Code</span><span class="pill-agent">Jules</span></div>
      </div>
    </div>
    <div class="signup-row">No account? <a href="#">Request access</a></div>
  </div>
</div>
<div class="version-badge">GitNexus v2.0</div>
<script>
  function selectPill(el) {
    el.closest('.role-pills').querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
  }
</script>
</body>
</html>
